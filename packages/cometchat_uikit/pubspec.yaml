name: cometchat_chat_uikit
description: CometChat's Flutter UI Kit offers custom UI components for streamlined text and chat features in your app, designed with developers in mind to minimize development effort.
version: 6.2.0
homepage: https://www.cometchat.com/
repository: https://github.com/cometchat/cometchat-uikit-flutter
issue_tracker: https://github.com/cometchat/cometchat-uikit-flutter/issues
topics:
  - chat
  - messaging
  - chat-ui
  - cometchat
  - uikit
screenshots:
  - description: "CometChat Flutter UI Kit components: conversations, messages, and calls."
    path: screenshots/overview_cometchat_screens.png

environment:
  sdk: '>=3.10.8 <4.0.0'
  flutter: ">=3.38.9"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  intl: ^0.20.2
  path_provider: ^2.1.2
  webview_flutter: ^4.13.0
  url_launcher: ^6.3.2
  # Transitive dependency lag is inherited from these two SDKs and cannot be
  # closed from this repository:
  #   connectivity_plus      6.1.5  (latest 7.x)  via cometchat_calls_sdk
  #   flutter_secure_storage 10.3.1 (latest 11.x) via cometchat_sdk
  cometchat_sdk: ^5.0.8
  cometchat_cards: ^1.0.1
  video_player: ^2.10.1
  http: ^1.4.0
  image_picker: ^1.2.1
  image_picker_android: ^0.8.13
  image_picker_platform_interface: ^2.11.1
  flutter_svg: ^2.2.2
  flutter_cache_manager: ^3.4.1
  # Held at 3.x deliberately: cached_network_image 4.0.0 requires Dart
  # ^3.12.0, above this package's 3.10.8 floor.
  cached_network_image: ^3.4.1
  # Floor at 5.0.8, the release the call UI is tested against. 5.0.4's
  # CometChatCalls.logout() also de-initialised the plugin, and it pinned
  # the native CometChatCallsSDK and calls-sdk-android at 5.0.2 (5.0.8 pins
  # 5.0.4). The floor is a hard requirement: the kit calls
  # CometChatOngoingCallService.launch(isVideo:), which 5.0.4 lacks, so a
  # dependency_override back to 5.0.4 stops the kit compiling. iOS apps with
  # an existing Podfile.lock need `pod update CometChatCallsSDK` once.
  cometchat_calls_sdk: ^5.0.8
  # Ceiling held below 13 deliberately. Admitting 13.x does not merely permit
  # it, it lets pub choose it, and permission_handler 13.0.1 pulls
  # permission_handler_android 14.0.0, whose build.gradle.kts uses a top-level
  # `kotlin { compilerOptions { } }` block without ever applying the Kotlin
  # Gradle plugin, and which requires compileSdk 37 -- past what AGP 9.0.1
  # supports. Every integrator on AGP 8 would break, with an error pointing
  # into .pub-cache and no hint the UI Kit caused it.
  permission_handler: '>=12.0.0 <13.0.0'
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  diffutil_dart: ^5.0.0
  scrollview_observer: ^1.27.0
  gpt_markdown: ^1.1.2
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
      sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.3
  bloc_test: ^10.0.0
  network_image_mock: ^2.1.1
  glados: ^1.1.7
  alchemist: ^0.14.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  plugin:
    platforms:
      android:
        package: com.cometchat.cometchat_chat_uikit
        pluginClass: CometchatChatUikitPlugin
      ios:
        pluginClass: CometchatChatUikitPlugin
      web:
        pluginClass: CometchatChatUikitPluginWeb
        fileName: cometchat_chat_uikit_web.dart

  # To add assets to your plugin package, add an assets section, like this:
#  assets:
#    - assets/sound/
#    - assets/icons/
#    - assets/icons/2x/

  # To add custom fonts to your plugin package, add a fonts section here,
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic

  assets:
    - assets/sound/
    - assets/icons/
    - assets/icons/2x/
    - assets/icons/light/
    - assets/icons/dark/
    - assets/icons/svg/calls/
    - assets/icons/svg/attachments/
