name: sample_app
description: "A sample app"
publish_to: 'none'
# The sample app is versioned independently of the cometchat_chat_uikit
# release it demonstrates; only the dependency constraint below tracks the
# library. The build number feeds Android versionCode via flutter.versionCode,
# so it must only ever increase.
version: 6.2.0

environment:
  sdk: '>=3.10.8 <4.0.0'
  flutter: '>=3.38.9'

dependencies:
  flutter:
    sdk: flutter
  cometchat_chat_uikit: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/