name: cometchat_uikit_shared
description: Shared Components and Resources for CometChat's chat and calls UI Kits
version: 5.3.1
homepage: https://www.cometchat.com/

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  video_player: ^2.7.2
  url_launcher: ^6.1.12
  http: ^1.0.0
  flutter_image: ^4.1.0
  intl: any
  get: ^4.6.5
  image_picker: ^1.0.5
  path_provider: ^2.1.2
  webview_flutter: ^4.4.3
  cometchat_sdk: ^4.1.5
  flutter_svg: ^2.0.17
  gpt_markdown: ^1.1.2
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  provider: ^6.1.0
  cross_cache: ^1.0.0
  diffutil_dart: ^3.0.0
  scrollview_observer: ^1.0.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.4.0
  freezed: ^3.2.3
  json_serializable: ^6.7.0
  glados: ^1.1.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  plugin:
    platforms:
      android:
        package: com.cometchat.cometchat_uikit_shared
        pluginClass: CometchatUikitSharedPlugin
      ios:
        pluginClass: CometchatUikitSharedPlugin

  # To add assets to your plugin package, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # To add custom fonts to your plugin package, add a fonts section here,
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic

  assets:
    - assets/sound/
    - assets/icons/
    - assets/icons/2x/
    - assets/icons/light/
    - assets/icons/dark/
    - assets/icons/svg/calls/
